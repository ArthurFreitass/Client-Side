<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - Quadrados Coloridos</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .quadrado {
            width: 100px;
            height: 100px;
            background-color: gray;
            transition: background-color 0.3s ease;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="q1" class="quadrado"></div>
        <div id="q2" class="quadrado"></div>
        <div id="q3" class="quadrado"></div>
    </div>

    <button onclick="colorirQuadrados()">Colorir</button>

    <script>
        function colorirQuadrados() {
            document.getElementById('q1').style.backgroundColor = 'red';
            document.getElementById('q2').style.backgroundColor = 'green';
            document.getElementById('q3').style.backgroundColor = 'blue';
        }
    </script>

</body>
</html>
