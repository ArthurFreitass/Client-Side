<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 17</title>
    <style>
        #minhaDiv {
            width: 200px;
            height: 200px;
            background-color: orange;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="minhaDiv"></div>

    <button onclick="limparCor()">Limpar Cor</button>

    <script>
        function limparCor() {
            document.getElementById('minhaDiv').style.backgroundColor = 'white';
        }
    </script>

</body>
</html>
