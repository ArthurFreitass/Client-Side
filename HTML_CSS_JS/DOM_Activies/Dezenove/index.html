<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio - Exercício 19</title>
  <style>
    h1 {
      color: black;
      background-color: transparent;
      transition: all 0.3s ease;
      display: inline-block;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h1 id="meuTitulo">Título do Desafio</h1>
  <button id="botaoDestacar">Destacar</button>

  <script>
    const titulo = document.getElementById('meuTitulo');
    const botao = document.getElementById('botaoDestacar');

    botao.addEventListener('click', () => {
      titulo.style.color = 'white';
      titulo.style.backgroundColor = 'blue';
    });
  </script>

</body>
</html>
