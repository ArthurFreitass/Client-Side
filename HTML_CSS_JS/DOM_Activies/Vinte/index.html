<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Círculo e Botão</title>
  <style>
    #circulo {
      width: 100px;
      height: 100px;
      background-color: blue;
      border-radius: 50%;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="circulo"></div>
  <button onclick="esconderElemento()">Esconder</button>

  <script>
    function esconderElemento() {
      const circulo = document.getElementById("circulo");
      
      circulo.style.display = "none";
    }
  </script>

</body>
</html>
