<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Clique aqui</span>
    <br><br>
    <button>Remover evento</button>

    <script>
        const emojis = [
            "😀", "😃", "😄", "😁", "😆",
            "😅", "😂", "🤣", "😊", "😇",
            "🙂", "🙃", "😉", "😌", "😍",
            "🥰", "😘", "😗", "😙", "😚",
            "😋", "😛", "😝", "😜", "🤪",
            "🤨", "🧐", "🤓", "😎", "🤩"
        ];

        const span = document.querySelector('span')
        const btn = document.querySelector('button')

        const changeEmote = () => {
            let i = Math.floor(Math.random() * 31);
            span.textContent = emojis[i]
        }        

        span.addEventListener("click", changeEmote)
        btn.addEventListener("click", () => {
            span.removeEventListener("click", changeEmote)
        })
    
    </script>
</body>

</html>
