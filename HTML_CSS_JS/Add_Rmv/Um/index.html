<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button>ATIVAR</button>
    <button>DESATIVAR</button>
    <p></p>

    <script>
        const btns = document.querySelectorAll("button")
        const p = document.querySelector("p")

        const pActive = () => {
            p.innerText = "Como outros usuários deste dispositivo não terão acesso à sua atividade, você pode navegar com mais privacidade. Isso não vai mudar a forma como os dados são coletados pelos sites que você acessa e pelos serviços que eles usam, incluindo o Google. Os itens da Lista de Leitura, downloads e favoritos ainda serão salvos."
        }

        const pText = () => {
            alert("Voce clicou no paragráfo!")
        }

        btns.forEach((ele, i) => {
            if (i == 0) {
                p.addEventListener("click", pText)
                ele.addEventListener("click", pActive)
            }
            if (i == 1) {
                ele.addEventListener("click", () => {
                    p.innerText = ""
                    p.removeEventListener("click", pText)
                })
            }
        })
    </script>
</body>

</html>
