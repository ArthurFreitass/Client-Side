<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Mouse</title>
</head>

<body>
    <button id="ativar">Ativar Mouse</button>
    <button id="desativar">Desativar Mouse</button>

    <h1 id="resultado"></h1>

    <script>
        const btnAtivar = document.getElementById("ativar");
        const btnDesativar = document.getElementById("desativar");
        const h1 = document.getElementById("resultado");

        const mostrarCoordenadas = (event) => {
            const x = event.clientX;
            const y = event.clientY;
            h1.textContent = `X: ${x} | Y: ${y}`;
        };

        btnAtivar.addEventListener("click", () => {
            document.addEventListener("mousemove", mostrarCoordenadas);
        });

        btnDesativar.addEventListener("click", () => {
            document.removeEventListener("mousemove", mostrarCoordenadas);
        });
    </script>
</body>

</html>
