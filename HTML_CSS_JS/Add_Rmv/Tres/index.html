<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <button>Ativar contador</button>
    <button>Desativar contador</button>
    <br><br>
    <button>Contador: </button>
    <h1></h1>

    <script>

        const buttons = document.querySelectorAll("button")

        const addCount = () => {
            count += 1
            buttons[2].textContent = count
        }

        let count = 0

        buttons[0].addEventListener("click", () => {
            buttons[0].textContent = "Incrementar o contador"
            buttons[0].addEventListener("click", addCount)
        })

        buttons[1].addEventListener("click", () => {
            buttons[0].textContent = "Reativar o contador"
            buttons[0].removeEventListener("click", addCount)
        })
    </script>
</body>
