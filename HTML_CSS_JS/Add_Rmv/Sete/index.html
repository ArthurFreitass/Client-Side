<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7 - Exibir Alerta</title>
    <style>
        img {
            display: block;
            margin-top: 20px;
            cursor: pointer;
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <button id="btn-ligar">Ligar Alerta</button>
    <button id="btn-desligar">Desligar Alerta</button>
    
    <img id="imagem" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnBzUe0iJ-HPmp40Wk4IjfcgQa-Ms53STtNgzyJ-1Q1g&s=10" alt="Imagem Interativa">

    <script>
        const btnLigar = document.getElementById("btn-ligar");
        const btnDesligar = document.getElementById("btn-desligar");
        const imagem = document.getElementById("imagem");

        const exibirAlerta = () => {
            alert("Alerta disparado!");
        };

        btnLigar.addEventListener("click", () => {
            imagem.removeEventListener("click", exibirAlerta);
            imagem.addEventListener("click", exibirAlerta);
        });

        btnDesligar.addEventListener("click", () => {
            imagem.removeEventListener("click", exibirAlerta);
        });
    </script>

</body>
</html>
