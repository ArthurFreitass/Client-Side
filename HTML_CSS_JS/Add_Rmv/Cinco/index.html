<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button>Ativar evento</button>
    <button>Remover evento</button>
    <h1>Clique aqui!</h1>

    <script>


        const buttons = document.querySelectorAll("button")
        const h1 = document.querySelector("h1")

        const phrases = [
            "A prática leva à perfeição.",
            "O código limpo é a melhor documentação.",
            "Continue iterando e aprendendo.",
            "A persistência é o caminho do êxito."
        ];


        const changeText = () => {
            let i = Math.floor(Math.random() * 3) + 1;
            h1.textContent = phrases[i]
        }

        buttons[0].addEventListener("click", () => {
            buttons[0].textContent = "Executar evento"
            h1.addEventListener("click", changeText)
        })

        buttons[1].addEventListener("click", () => {
            buttons[0].textContent = "Reativar evento"
            h1.removeEventListener("click", changeText)
        })
    </script>
</body>

</html>
