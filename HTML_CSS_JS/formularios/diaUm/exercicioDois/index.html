<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Atividade 2 — Formulário de Login
Crie uma tela de login semelhante a sistemas reais.
O formulário deve possuir:
• Campo de usuário
• Campo de senha
• Checkbox “Lembrar senha”
• Botão “Entrar”
• Link “Esqueci minha senha”
Desafio:
• Centralize tudo na tela.
• Adicione cores e estilização com CSS.-->

    <form action="" method="get">
        <div>
            <label for="user">Usuário</label>
            <input type="text" placeholder="Digite seu nome de usuário:" id="user" required>
            <label for="password">Senha:</label>
            <input type="password" name="password" id="password" required placeholder="Digite sua senha:"> 
        </div>
        <div class="save">
            <label for="save">Lembrar senha</label>
            <input type="checkbox" name="save-account" id="save">
        </div>
        <div>
            <button type="submit">Entrar</button>
        </div>
        <span style="display: inline-block; margin-top: 1.5rem; margin-bottom: 1rem;"><a href="">Esqueci minha senha</a></span>
    </form>
</body>
</html>
