<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Vaga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Candidato</h1>

        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <input type="text" placeholder="Nome completo" required>
                <input type="text" placeholder="CPF" required>
                <input type="text" placeholder="RG" required>
                <input type="date" required>

                <select required>
                    <option value="">Sexo</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Outro</option>
                </select>
            </fieldset>

            <!-- Contato -->
            <fieldset>
                <legend>Contato</legend>

                <input type="email" placeholder="E-mail" required>
                <input type="tel" placeholder="Telefone">
                <input type="tel" placeholder="Celular" required>
            </fieldset>

            <!-- Endereço -->
            <fieldset>
                <legend>Endereço</legend>

                <input type="text" placeholder="Rua" required>
                <input type="number" placeholder="Número" required>
                <input type="text" placeholder="Bairro" required>
                <input type="text" placeholder="Cidade" required>

                <select required>
                    <option value="">Estado</option>
                    <option>MG</option>
                    <option>SP</option>
                    <option>RJ</option>
                    <option>Outros</option>
                </select>
            </fieldset>

            <!-- Informações profissionais -->
            <fieldset>
                <legend>Informações Profissionais</legend>

                <select required>
                    <option value="">Escolaridade</option>
                    <option>Ensino Médio</option>
                    <option>Superior</option>
                    <option>Pós-graduação</option>
                </select>

                <textarea placeholder="Cursos"></textarea>
                <textarea placeholder="Experiência profissional"></textarea>
                <input type="text" placeholder="Pretensão salarial" required>
            </fieldset>

            <!-- Tecnologias -->
            <fieldset>
                <legend>Tecnologias</legend>

                <div class="checkbox-group">
                    <label><input type="checkbox"> HTML</label>
                    <label><input type="checkbox"> CSS</label>
                    <label><input type="checkbox"> JavaScript</label>
                    <label><input type="checkbox"> Java</label>
                    <label><input type="checkbox"> Python</label>
                    <label><input type="checkbox"> Banco de Dados</label>
                </div>
            </fieldset>

            <!-- Upload -->
            <fieldset>
                <legend>Envio</legend>

                <input type="file" required>
            </fieldset>

            <button type="submit">Cadastrar</button>

        </form>
    </div>

</body>
</html>
