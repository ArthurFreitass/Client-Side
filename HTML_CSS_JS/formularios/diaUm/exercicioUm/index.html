<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro formulário</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <!--Atividade 1 — Cadastro Simples
Crie uma página chamada cadastro.html com um formulário contendo:
Campos obrigatórios:
• Nome completo
• E-mail
• Senha
• Data de nascimento
• Telefone
• Cidade
• Estado
• Botão “Enviar”
• Botão “Limpar”-->
    <form action="" method="get">
        <div class="cont-1">
            <h1>Form</h1>
            <input type="text" id="name" placeholder="Digite o seu nome:" required>
            <input type="password" name="password" id="password" placeholder="Digite sua senha:" required>
            <label for="date">Data de nascimento</label>
            <input type="date" name="birthdate" id="date">
            <label for="phone">Número de telefone</label>
            <input type="text" name="phone number" id="phone" placeholder="No formato: 31 12345-6789:">
            <select name="cities" id="city">
                <option value="">Belo Horizonte</option>
                <option value="">Ribeirão da Neves</option>
                <option value="">Santa Luzia</option>
            </select>
            <select name="state" id="state">
                <option value="">Minas Gerais</option>
                <option value="">Rio de Janeiro</option>
                <option value="">São Paulo</option>
            </select>
        </div>
        <div>
            <button type="submit">Enviar</button>
            <input type="reset" value="Limpar">
        </div>
    </form>
    <script src="script.js"></script>
</body>

</html>
