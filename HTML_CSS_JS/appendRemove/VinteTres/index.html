<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartões de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .botoes {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        button:hover {
            background-color: #e2e6ea;
        }
        #catalogo {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .cartao-produto {
            border: 1px solid #000;
            padding: 15px;
            width: 150px;
            border-radius: 4px;
            background-color: #fff;
        }
        .nome-produto {
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .preco-produto {
            color: #28a745;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>Catálogo de Produtos</h2>
    
    <div class="botoes">
        <button id="btnAdicionar">Adicionar Produto</button>
        <button id="btnRemover">Remover Último Produto</button>
    </div>

    <div id="catalogo"></div>

    <script>
        const produtos = [
            { nome: 'Notebook', preco: 'R$ 3.500,00' },
            { nome: 'Smartphone', preco: 'R$ 1.899,00' },
            { nome: 'Teclado Mecânico', preco: 'R$ 250,00' },
            { nome: 'Mouse Gamer', preco: 'R$ 150,00' },
            { nome: 'Monitor 24"', preco: 'R$ 899,00' }
        ];

        const btnAdicionar = document.getElementById('btnAdicionar');
        const btnRemover = document.getElementById('btnRemover');
        const catalogo = document.getElementById('catalogo');
        let indice = 0;

        btnAdicionar.addEventListener('click', function() {
            if (indice < produtos.length) {
                const produtoAtual = produtos[indice];

                const cartao = document.createElement('div');
                cartao.classList.add('cartao-produto');

                const nome = document.createElement('p');
                nome.classList.add('nome-produto');
                nome.textContent = produtoAtual.nome;

                const preco = document.createElement('p');
                preco.classList.add('preco-produto');
                preco.textContent = produtoAtual.preco;

                cartao.appendChild(nome);
                cartao.appendChild(preco);
                catalogo.appendChild(cartao);

                indice++;
            }
        });

        btnRemover.addEventListener('click', function() {
            const ultimoProduto = catalogo.lastElementChild;
            if (ultimoProduto) {
                catalogo.removeChild(ultimoProduto);
                indice--;
            }
        });
    </script>

</body>
</html>
