<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica de Botões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #btnPrincipal {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #btnPrincipal:hover {
            background-color: #0056b3;
        }
        #painelBotoes {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 100px;
            border-radius: 4px;
        }
        .botao-criado {
            padding: 8px 15px;
            margin: 5px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .botao-criado:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <h2>Fábrica de Botões</h2>
    
    <button id="btnPrincipal">Criar Botão</button>

    <div id="painelBotoes"></div>

    <script>
        const btnPrincipal = document.getElementById('btnPrincipal');
        const painelBotoes = document.getElementById('painelBotoes');
        let contador = 1;

        btnPrincipal.addEventListener('click', function() {
            const novoBotao = document.createElement('button');
            novoBotao.textContent = 'Botão ' + contador;
            novoBotao.classList.add('botao-criado');
            
            painelBotoes.appendChild(novoBotao);
            contador++;
        });
    </script>

</body>
</html>
