<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Um</title>
</head>

<body>
    <input type="text">
    <button>Adicionar Produto</button>
    <button id="btn-rmv">Remover último Produto</button>
    <ul></ul>
    <script>
        const input = document.querySelector("input")
        const ul = document.querySelector("ul")
        const btns = document.querySelector('button')
        const btnRemove = document.getElementById("btn-rmv")

        const addMessage = () => {
            if (input.value.trim() == "") {
                alert("Digite o nome de algum produto!")
            } else {
                const li = document.createElement("li")
                li.innerText = input.value
                ul.appendChild(li)
                input.value = ""
            }
        }

        const rmvMessage = () => {
            const childs = ul.children
            if (childs.length > 0) {
                const last = childs[childs.length - 1]
                ul.removeChild(last);
            } else {
                alert("Adicione algum produto!")
            }
        }

        btns.addEventListener("click", addMessage)
        btnRemove.addEventListener("click", rmvMessage)
    </script>
</body>

</html>
