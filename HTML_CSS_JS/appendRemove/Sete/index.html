<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: square;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <h2>Cadastro de Alunos</h2>
    
    <div class="form-group">
        <label for="nomeAluno">Nome do Aluno:</label>
        <input type="text" id="nomeAluno" placeholder="Digite o nome completo">
    </div>
    
    <button id="btnCadastrar">Cadastrar Aluno</button>
    <button id="btnRemove">Remover último Aluno</button>

    <h3>Lista de Alunos</h3>
    <ul id="listaAlunos"></ul>

    <script>
        const inputNome = document.getElementById('nomeAluno');
        const btnCadastrar = document.getElementById('btnCadastrar');
        const btnRemove = document.getElementById('btnRemove');
        const listaAlunos = document.getElementById('listaAlunos');

        btnCadastrar.addEventListener('click', function() {
            const nome = inputNome.value.trim();

            if (nome !== '') {
                const novoItem = document.createElement('li');
                novoItem.textContent = nome;
                listaAlunos.appendChild(novoItem);
                inputNome.value = '';
                inputNome.focus();
            }
        });

        const removeLastStudent = () => {
            const childs = listaAlunos.children
            if (childs.length > 0) {
                const last = childs[childs.length - 1]
                listaAlunos.removeChild(last)
            } else {
                alert("Adicione algum aluno!")
            }
        }


        btnRemove.addEventListener("click", removeLastStudent)

        inputNome.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                btnCadastrar.click();
            }
        });
    </script>

</body>
</html>
