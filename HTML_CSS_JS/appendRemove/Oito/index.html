<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Quadrados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        #areaQuadrados {
            border: 2px dashed #ccc;
            min-height: 200px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .quadrado {
            width: 50px;
            height: 50px;
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <h2>Criador de Quadrados</h2>
    
    <button id="btnCriar">Criar Quadrado</button>

    <div id="areaQuadrados"></div>

    <script>
        const btnCriar = document.getElementById('btnCriar');
        const areaQuadrados = document.getElementById('areaQuadrados');

        btnCriar.addEventListener('click', function() {
            const novoQuadrado = document.createElement('div');
            novoQuadrado.classList.add('quadrado');
            areaQuadrados.appendChild(novoQuadrado);
        });
    </script>

</body>
</html>
