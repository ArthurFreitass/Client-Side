<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Emojis</title>
</head>
<style>
    button {
        background-color: rgb(0, 200, 255);
        color: white;
        width: 120px;
        height: 30px;
        border-radius: 10px;
        cursor: pointer;
        border: none;
        transition: 0.4s;
        margin-bottom: 1rem;
    }

    button:hover {
        background-color: darkblue;
    }
</style>
<body>

    <h2>Gerador de Emojis</h2>
    
    <button id="btnCriar">Criar Emoji</button>

    <div id="painelEmojis"></div>

    <script>
        const btnCriar = document.getElementById('btnCriar');
        const painelEmojis = document.getElementById('painelEmojis');
        const emojis = ['😀', '😂', '🥰', '😎', '🚀', '🎉', '🔥', '🎨', '🍕', '🐱'];

        btnCriar.addEventListener('click', function() {
            const novoSpan = document.createElement('span');
            const emojiAleatorio = emojis[Math.floor(Math.random() * emojis.length)];
            
            novoSpan.textContent = emojiAleatorio + ' ';
            painelEmojis.appendChild(novoSpan);
        });
    </script>

</body>
</html>
