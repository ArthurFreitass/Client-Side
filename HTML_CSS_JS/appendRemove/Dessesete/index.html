<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Cliques</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #20c997;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #1cbd8e;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Histórico de Cliques</h2>
    
    <button id="btnClique">Clique Aqui</button>

    <ul id="historico"></ul>

    <script>
        const btnClique = document.getElementById('btnClique');
        const historico = document.getElementById('historico');

        btnClique.addEventListener('click', function() {
            const novaLinha = document.createElement('li');
            novaLinha.textContent = 'Você clicou no botão!';
            historico.appendChild(novaLinha);
        });
    </script>

</body>
</html>
