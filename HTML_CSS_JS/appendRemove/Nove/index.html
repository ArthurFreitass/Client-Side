<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Quadrados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .botoes {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
        }
        #btnCriar {
            background-color: #28a745;
        }
        #btnCriar:hover {
            background-color: #218838;
        }
        #btnRemover {
            background-color: #dc3545;
        }
        #btnRemover:hover {
            background-color: #bd2130;
        }
        #areaQuadrados {
            border: 2px dashed #ccc;
            min-height: 200px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .quadrado {
            width: 50px;
            height: 50px;
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <h2>Gerenciador de Quadrados</h2>
    
    <div class="botoes">
        <button id="btnCriar">Criar Quadrado</button>
        <button id="btnRemover">Remover Quadrado</button>
    </div>

    <div id="areaQuadrados"></div>

    <script>
        const btnCriar = document.getElementById('btnCriar');
        const btnRemover = document.getElementById('btnRemover');
        const areaQuadrados = document.getElementById('areaQuadrados');

        btnCriar.addEventListener('click', function() {
            const novoQuadrado = document.createElement('div');
            novoQuadrado.classList.add('quadrado');
            areaQuadrados.appendChild(novoQuadrado);
        });

        btnRemover.addEventListener('click', function() {
            const ultimoQuadrado = areaQuadrados.lastElementChild;
            if (ultimoQuadrado) {
                areaQuadrados.removeChild(ultimoQuadrado);
            } else {
                alert("Adicione um quadrado primeiro!")
            }
        });
    </script>

</body>
</html>
