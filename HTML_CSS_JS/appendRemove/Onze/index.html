<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases Motivacionais</title>
</head>
<body>

    <h2>Frases Motivacionais</h2>
    
    <button id="btnFrase">Nova Frase</button>

    <div id="painelFrases"></div>

    <script>
        let frases = [
            "Você consegue!",
            "Nunca desista!",
            "Continue estudando!",
            "Seu esforço vale a pena!"
        ];

        const btnFrase = document.getElementById('btnFrase');
        const painelFrases = document.getElementById('painelFrases');

        btnFrase.addEventListener('click', function() {
            painelFrases.innerHTML = '';
            
            const paragrafo = document.createElement('p');
            const fraseAleatoria = frases[Math.floor(Math.random() * frases.length)];
            
            paragrafo.textContent = fraseAleatoria;
            painelFrases.appendChild(paragrafo);
        });
    </script>

</body>
</html>
