<html lang="pt-br">

<head>
    <meta charset="UTF-8">

</head>

<body>

    <!--Exercício 7 — Mesclando linhas (rowspan)
Monte uma tabela de matérias:
• Matéria
• Professor Faça com que uma matéria ocupe 2 linhas usando
rowspan-->

    <h1>Disciplinas</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Matéria</th>
                <th>Professor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Matemática</td>
                <td>Hugo</td>
            </tr>
            <tr>
                <td>Luís</td>
            </tr>

            <tr>
                <td rowspan="2">Ciências</td>
                <td>Arthur</td>
            </tr>
            <tr>
                <td>Mbappé</td>
            </tr>

            <tr>
                <td rowspan="2">Biologia</td>
                <td>Richard</td>
            </tr>
            <tr>
                <td>Hazard</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
